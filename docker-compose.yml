version: '3.6'
services:
  mysql-a:
    image: mysql:8.4
    command:
      - --server-id=1
      - --log-bin=mysql-bin
      - --gtid-mode=ON
      - --enforce-gtid-consistency=ON
    container_name: ticketing
    ports:
      - "3306:3306"
    environment:
      MYSQL_DATABASE: ticketing
      MYSQL_USER: ticketing
      MYSQL_PASSWORD: ticketing-password
      MYSQL_ROOT_PASSWORD: root-password
    volumes:
      - mysql-a-data:/var/lib/mysql
  rabbitmq:
    image: "rabbitmq:latest"
    container_name: "rabbitmq"
    environment:
      RABBITMQ_DEFAULT_PASS: password
      RABBITMQ_DEFAULT_USER: user
    ports:
      - "5672:5672"
  mysql-b:
    image: mysql:8.4
    command:
      - --server-id=2
      - --log-bin=mysql-bin
      - --gtid-mode=ON
      - --enforce-gtid-consistency=ON
    container_name: ticketing-replica
    ports:
      - "3307:3306"
    environment:
      MYSQL_DATABASE: ticketing
      MYSQL_USER: ticketing
      MYSQL_PASSWORD: ticketing-password
      MYSQL_ROOT_PASSWORD: root-password
    volumes:
      - mysql-b-data:/var/lib/mysql
volumes:
  mysql-a-data:
  mysql-b-data:
