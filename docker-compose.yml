version: '3.6'
services:
  mysql:
    image: mysql:8.4
    container_name: ticketing-mysql
    ports:
      - "3306:3306"
    environment:
      MYSQL_DATABASE: ticketing
      MYSQL_USER: ticketing
      MYSQL_PASSWORD: ticketing-password
      MYSQL_ROOT_PASSWORD: root-password
    volumes:
      - mysql-data:/var/lib/mysql
volumes:
  mysql-data:
